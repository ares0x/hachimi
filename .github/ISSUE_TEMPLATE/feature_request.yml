name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe what you'd like to see.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? Is it related to a frustration or limitation?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution you'd like — what should Hachimi do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches have you tried or considered?
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: What part of Hachimi does this affect?
      options:
        - Core / Agent
        - Memory / Storage
        - Tool system
        - TUI
        - CLI
        - Web UI
        - Telegram Bot
        - Daemon / API
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, references, or screenshots
    validations:
      required: false
