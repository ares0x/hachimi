name: Bug Report
description: Report a bug in Hachimi
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below.
  - type: input
    id: version
    attributes:
      label: Hachimi version
      description: Run `pnpm dev:cli --version` or check package.json
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Channel
      description: Which channel are you using?
      options:
        - TUI
        - CLI
        - Web
        - Desktop
        - Telegram
        - API
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Clear steps to trigger the bug
      placeholder: |
        1. Run `pnpm dev:server`
        2. Send POST to `/api/chat` with `{...}`
        3. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs & screenshots
      description: Paste any relevant error logs or screenshots
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. macOS 15, Ubuntu 24.04, Windows 11"
    validations:
      required: false
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "e.g. 22.12.0"
    validations:
      required: false
